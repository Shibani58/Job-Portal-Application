# "demo" profile: runs the app without MySQL, using an in-memory H2 database
# seeded with sample data. Used by the live demo (Dockerfile / render.yaml).
# Everything resets when the app restarts.

# MODE=MySQL + IGNORECASE mimic MySQL's case-insensitive text matching
spring.datasource.url=jdbc:h2:mem:jobportal;MODE=MySQL;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Create the tables from the JPA entities, then load the sample data
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:demo/data.sql
spring.sql.init.encoding=UTF-8
